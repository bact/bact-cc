<!doctype html>
<html lang="{{ .Params.lang | default site.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="/">{{ site.Title }}</a>
    <nav aria-label="Main">{{ range site.Menus.main }}<a href="{{ .URL }}"{{ if $.RelPermalink | eq .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}</nav>
  </div>
</header>
<main id="main" class="wrap">{{ block "main" . }}{{ end }}</main>
<footer class="site-footer"><div class="wrap">
  <p>{{ site.Params.description }}</p>
  <p><a href="/index.xml">RSS</a> · <a href="/on/">Categories</a> · <a href="/tag/">Tags</a> · <a href="/2004/">Archive</a></p>
</div></footer>
</body>
</html>
