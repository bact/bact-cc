name: build
on:
  push:
  pull_request:
permissions:
  contents: read          # read-only; this workflow needs no secrets at all
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.152.2"   # keep in sync with HUGO_VERSION in Cloudflare Pages
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo (pinned, checksum-verified)
        run: |
          f="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSL -O "$base/$f"
          curl -fsSL -O "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $f\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$f" hugo && sudo mv hugo /usr/local/bin/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint Markdown
        run: |
          npm ci
          npm run lint:md
      - name: Build site + search index
        run: |
          npm ci --ignore-scripts=false
          npm run build
      - name: Check internal links and images
        run: python3 tools/check_links.py
